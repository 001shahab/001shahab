name: Rotate quote

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotate-quote
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick a new quote
        run: python .github/scripts/rotate_quote.py

      - name: Commit and push
        run: |
          if git diff --quiet -- README.md; then
            echo "Quote unchanged, nothing to push."
            exit 0
          fi
          git -c user.name="Shahab Anbarjafari" \
              -c user.email="shb@3sholding.com" \
              commit -m "Rotate quote" -- README.md
          git push
